name: Android APK and offline checks
on:
  pull_request:
    paths: ['mobile/**', '*.js', '*.css', 'index.html', 'tests/**', 'package*.json', '.github/workflows/android.yml']
  push:
    branches: [main, 'feat/android-offline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:android
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}
      - run: gradle -p mobile/android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CineDairy-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-results
          path: |
            mobile/android/app/build/reports/lint-results-debug.html
            ${{ runner.temp }}/android-offline.png
